hmpps-auth:
  url: "http://localhost:8090/auth"

prison-api:
  url: "http://localhost:8091"

case-notes-api:
  url: "http://localhost:8092"

prisoner-search:
  url: "http://localhost:8093"

locations-inside-prison-api:
  url: "http://localhost:8095"

system:
  client:
    id: ${SYSTEM_CLIENT_ID:hmpps-change-someones-cell-api-client}
    secret: ${SYSTEM_CLIENT_SECRET:clientsecret}

spring:
  datasource:
    # A local Postgres presents no CA we can verify against, so relax the production
    # sslmode=verify-full. Defaults let `./gradlew bootRun --args='--spring.profiles.active=dev'`
    # work against docker compose without exporting anything.
    url: 'jdbc:postgresql://${DATABASE_ENDPOINT:localhost:5432}/${DATABASE_NAME:change_someones_cell}?sslmode=prefer'
    username: ${DATABASE_USERNAME:change_someones_cell}
    password: ${DATABASE_PASSWORD:change_someones_cell}

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
# The prisoner event queue (MAPA-438), on the LocalStack from docker-compose.yml. hmpps-sqs creates the
# topic, the queue and the filtered subscription on start-up. Deployed environments name a real queue
# through the HMPPS_SQS_QUEUES_PRISONEREVENTS_* variables in the helm values instead.
hmpps.sqs:
  provider: localstack
  queues:
    prisonerevents:
      queueName: cell-move-prisoner-event-queue
      dlqName: cell-move-prisoner-event-dlq
      subscribeTopicId: domainevents
      subscribeFilter: '{"eventType":["prison-offender-events.prisoner.merged","prison-offender-events.prisoner.booking.moved"]}'
  topics:
    domainevents:
      arn: arn:aws:sns:eu-west-2:000000000000:hmpps-domain-events
