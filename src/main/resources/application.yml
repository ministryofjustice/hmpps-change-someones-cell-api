info.app:
  name: HMPPS Change Someones Cell Api
  version: 1.0

spring:
  application:
    name: hmpps-change-someones-cell-api

  jackson:
    time-zone: "Europe/London"

#  This jackson configuration is only applied for java.util.Date.
#  It is ignored for LocalDateTime, and therefore unnecessary for most projects
#  jackson:
#    date-format: "yyyy-MM-dd HH:mm:ss"

  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${hmpps-auth.url}/.well-known/jwks.json

      client:
        registration:
          HMPPS_CHANGE_SOMEONES_CELL_API:
            provider: hmpps-auth
            client-id: ${system.client.id}
            client-secret: ${system.client.secret}
            authorization-grant-type: client_credentials
        provider:
          hmpps-auth:
            token-uri: ${hmpps-auth.url}/oauth/token
  http:
    codecs:
      max-in-memory-size: 10MB
  web:
    error:
      include-message: always

  jpa:
    open-in-view: false
    show-sql: false
    generate-ddl: false
    hibernate:
      ddl-auto: none

  flyway:
    enabled: true

  datasource:
    url: 'jdbc:postgresql://${DATABASE_ENDPOINT}/${DATABASE_NAME}?sslmode=verify-full'
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
    hikari:
      pool-name: CSC-API-DB-CP
      # Sized against the db.t4g.micro RDS, which Postgres caps at ~85 connections. A rolling
      # deploy runs old and new replicas side by side, so the worst case is (2 x replicas) pods
      # holding minimum-idle each and briefly bursting; 20/pod with min-idle defaulting to max
      # exhausted the instance in prod (4 replicas) and every rollout crashlooped on
      # "remaining connection slots are reserved".
      maximum-pool-size: 10
      minimum-idle: 2
      max-lifetime: 600000
      connection-timeout: 1000
      validation-timeout: 500

server:
  port: 8080
  servlet:
    context-path: /
  forward-headers-strategy: native
  tomcat:
    remoteip:
      remote-ip-header: x-forwarded-for
      protocol-header: x-forwarded-proto
      internal-proxies: 10\.\d{1,3}\.\d{1,3}\.\d{1,3}|192\.168\.\d{1,3}\.\d{1,3}|169\.254\.\d{1,3}\.\d{1,3}|127\.\d{1,3}\.\d{1,3}\.\d{1,3}|172\.1[6-9]{1}\.\d{1,3}\.\d{1,3}|172\.2[0-9]{1}\.\d{1,3}\.\d{1,3}|172\.3[0-1]{1}\.\d{1,3}\.\d{1,3}|0:0:0:0:0:0:0:1|::1|100\.6[4-9]\.\d{1,3}\.\d{1,3}|100\.[7-9][0-9]{1}\.\d{1,3}\.\d{1,3}|100\.1[0-1][0-9]{1}\.\d{1,3}\.\d{1,3}|100\.12[0-7]\.\d{1,3}\.\d{1,3}
  shutdown: graceful

management:
  endpoints:
    web:
      base-path: /
      exposure:
        include: 'info, health'
  endpoint:
    health:
      cache:
        time-to-live: 2000ms
      show-components: always
      show-details: always
      probes:
        enabled: true
    info:
      cache:
        time-to-live: 2000ms

# springdoc hardcodes the swagger-ui version it was built against (springdoc.config.properties inside
# springdoc-openapi-starter-common) and serves /swagger-ui/** from /webjars/swagger-ui/<that version>/.
# The HMPPS gradle plugin pins the swagger-ui webjar ahead of springdoc to remediate a DOMPurify issue,
# so springdoc looks for a directory that is not on the classpath and /swagger-ui/index.html 404s.
# Keep this in step with the webjar the plugin resolves — check with:
#   ./gradlew -q dependencies --configuration runtimeClasspath | grep swagger-ui
springdoc:
  swagger-ui:
    enabled: false
    version: 5.32.11
  api-docs:
    enabled: false
