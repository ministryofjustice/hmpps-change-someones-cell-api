server:
  shutdown: immediate

management.endpoint:
  health.cache.time-to-live: 0
  info.cache.time-to-live: 0

hmpps-auth:
  url: "http://localhost:8090/auth"

prison-api:
  url: "http://localhost:8091"

case-notes-api:
  url: "http://localhost:8092"

prisoner-search:
  url: "http://localhost:8093"

locations-inside-prison-api:
  url: "http://localhost:8095"

system:
  client:
    id: test-client-id
    secret: test-client-secret

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true

# Used when a Postgres is already listening on 5432 (e.g. docker compose up). When there is not,
# TestBase starts a container and overrides these with its details.
spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/change_someones_cell?sslmode=prefer
    username: change_someones_cell
    password: change_someones_cell
    hikari:
      pool-name: CSC-API-DB-CP
      maximum-pool-size: 10

# The prisoner event queue (MAPA-438), on LocalStack. Random names keep each Spring context to its own
# topic and queue. hmpps-sqs creates them and the filtered subscription on start-up.
hmpps.sqs:
  provider: localstack
  queues:
    prisonerevents:
      queueName: ${random.uuid}
      dlqName: ${random.uuid}
      subscribeTopicId: domainevents
      subscribeFilter: '{"eventType":["prison-offender-events.prisoner.merged","prison-offender-events.prisoner.booking.moved"]}'
  topics:
    domainevents:
      arn: arn:aws:sns:eu-west-2:000000000000:${random.uuid}
