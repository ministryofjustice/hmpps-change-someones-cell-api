services:
  hmpps-change-someones-cell-api:
    image: ghcr.io/ministryofjustice/hmpps-change-someones-cell-api:latest
    networks:
      - hmpps
    container_name: hmpps-change-someones-cell-api
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "bash", "-c", "echo > /dev/tcp/localhost/8080"]
    environment:
      - SERVER_PORT=8080
      - HMPPS_AUTH_URL=http://hmpps-auth:8080/auth
      - SPRING_PROFILES_ACTIVE=dev
      - DATABASE_ENDPOINT=change-someones-cell-db:5432
      - DATABASE_NAME=change_someones_cell
      - DATABASE_USERNAME=change_someones_cell
      - DATABASE_PASSWORD=change_someones_cell

  change-someones-cell-db:
    image: postgres:18
    networks:
      - hmpps
    container_name: change-someones-cell-db
    restart: always
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U change_someones_cell"]
    environment:
      - POSTGRES_USER=change_someones_cell
      - POSTGRES_PASSWORD=change_someones_cell
      - POSTGRES_DB=change_someones_cell

  hmpps-auth:
    image: ghcr.io/ministryofjustice/hmpps-auth:latest
    networks:
      - hmpps
    container_name: hmpps-auth
    ports:
      - "8090:8080"
    healthcheck:
      test: ["CMD", "bash", "-c", "echo > /dev/tcp/localhost/8080"]
    environment:
      - SERVER_PORT=8080
      - SPRING_PROFILES_ACTIVE=dev
      - APPLICATION_AUTHENTICATION_UI_ALLOWLIST=0.0.0.0/0

  localstack:
    image: localstack/localstack:community-archive
    networks:
      - hmpps
    container_name: localstack
    ports:
      - "4566:4566"
      - "8999:8080"
    environment:
      - DEBUG=${DEBUG- }
      - DOCKER_HOST=unix:///var/run/docker.sock
    volumes:
      - "${TMPDIR:-/tmp/localstack}:/var/lib/localstack"
      - "/var/run/docker.sock:/var/run/docker.sock"

networks:
  hmpps:
